name: Safety Suite

on:
  workflow_dispatch:

jobs:
  sanitizers:
    name: ${{ matrix.name }} full unit suite
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ASan
            flag: MES_ENABLE_ASAN
          - name: UBSan
            flag: MES_ENABLE_UBSAN
          - name: TSan
            flag: MES_ENABLE_TSAN
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev zlib1g-dev
      - name: Configure and build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Debug -D${{ matrix.flag }}=ON
          cmake --build build --parallel "$(nproc)"
      - name: Run unit suite
        run: scripts/ctest-guarded.sh build --output-on-failure --parallel "$(nproc)" -E E2E
      - name: Run reader-thread E2E under ${{ matrix.name }}
        run: |
          # The selection is pinned to literal test names, so every name must
          # still resolve: compare the count CTest reports for the selection
          # against the number of names given. Without this, a rename shrinks
          # the selection, or empties it, and CTest still exits 0.
          tests='E2EProtocol.StopInterruptsPoll|E2EBuffer.GracefulShutdownNoLeak'
          want=$(printf '%s\n' "$tests" | tr '|' '\n' | grep -c .)
          got=$(ctest --test-dir build -N -R "$tests" | sed -n 's/^Total Tests: //p')
          if [ "$got" != "$want" ]; then
            echo "Pinned selection resolved ${got:-0} of $want names; a pinned name no longer exists."
            exit 1
          fi
          MYSQL_VERSION=8.4 docker compose -f e2e/docker/docker-compose.yml up -d --wait
          ctest --test-dir build --output-on-failure -R "$tests"
      - name: Stop reader-thread E2E services
        if: always()
        run: docker compose -f e2e/docker/docker-compose.yml down -v

  parser-fuzz:
    name: Parser fuzz corpus (ASan + UBSan)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libclang-rt-dev libssl-dev zlib1g-dev
      - name: Build libFuzzer harness
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -B build-fuzz \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DMES_ENABLE_FUZZ=ON \
            -DMES_ENABLE_ASAN=ON \
            -DMES_ENABLE_UBSAN=ON
          cmake --build build-fuzz --target fuzz_feed --parallel "$(nproc)"
      - name: Run regression corpus and mutate
        run: |
          ./build-fuzz/core/fuzz_feed core/tests/fuzz/corpus \
            -max_total_time=180 \
            -timeout=10 \
            -rss_limit_mb=2048 \
            -print_final_stats=1
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: parser-fuzz-crash
          path: |
            crash-*
            timeout-*
            oom-*
          if-no-files-found: ignore
