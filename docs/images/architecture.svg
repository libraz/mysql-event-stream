<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">The layers, and what each one owns</title>
  <desc id="dsc">Four stacked bands, bottom to top: protocol, client, engine and the C ABI, each listing what it covers and the directory it lives in. A full-height card on the right holds the language bindings, reached through the C ABI band. An arrow up the left edge shows that each layer builds on the one below it.</desc>

  <style>
    .bg    { fill:#f7f7f5 }
    .grp   { fill:#eceee9 }
    .chip  { fill:#ffffff; stroke:#d5d6d1 }
    .card  { fill:#ffffff; stroke:#2c6e8f }
    .ln    { fill:none; stroke:#2c6e8f; stroke-width:1.4 }
    .ah    { fill:#2c6e8f }
    text   { font-family:Inter,"Helvetica Neue","Hiragino Sans","Noto Sans JP",Arial,sans-serif; fill:#1f2328 }
    .h     { font-size:12.5px }
    .lbl   { font-size:11px; fill:#6e7781; letter-spacing:.06em }
    .s     { font-size:10.5px; fill:#6e7781 }
    .mono  { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:10.5px; fill:#8a6a1f }
    @media (prefers-color-scheme: dark) {
      .bg{fill:#0d1117} .grp{fill:#12171d}
      .chip{fill:#161b22;stroke:#30363d} .card{fill:#161b22;stroke:#7fb3d5}
      .ln{stroke:#7fb3d5} .ah{fill:#7fb3d5} .mono{fill:#d9b45c}
      text{fill:#e6edf3} .lbl{fill:#8b949e} .s{fill:#8b949e}
    }
  </style>

  <defs>
    <marker id="a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="360" rx="12"/>

  <path class="ln" d="M 48 304 V 48" marker-end="url(#a)"/>
  <text class="lbl" x="34" y="174" text-anchor="middle" transform="rotate(-90 34 174)">each layer builds on the one below</text>

  <rect class="grp" x="62" y="44" width="560" height="59" rx="8"/>
  <text class="lbl" x="76" y="63">C ABI</text>
  <text class="mono" x="150" y="63">core/include/mes.h</text>
  <rect class="chip" x="76" y="72" width="86" height="24" rx="5"/>
  <text class="s" x="119" y="89" text-anchor="middle">mes_engine_t</text>
  <rect class="chip" x="170" y="72" width="86" height="24" rx="5"/>
  <text class="s" x="213" y="89" text-anchor="middle">mes_client_t</text>
  <rect class="chip" x="264" y="72" width="80" height="24" rx="5"/>
  <text class="s" x="304" y="89" text-anchor="middle">mes_event_t</text>
  <rect class="chip" x="352" y="72" width="80" height="24" rx="5"/>
  <text class="s" x="392" y="89" text-anchor="middle">mes_error_t</text>

  <rect class="grp" x="62" y="111" width="560" height="59" rx="8"/>
  <text class="lbl" x="76" y="130">engine</text>
  <text class="mono" x="150" y="130">core/src</text>
  <rect class="chip" x="76" y="139" width="96" height="24" rx="5"/>
  <text class="s" x="124" y="156" text-anchor="middle">feed buffering</text>
  <rect class="chip" x="180" y="139" width="86" height="24" rx="5"/>
  <text class="s" x="223" y="156" text-anchor="middle">event parser</text>
  <rect class="chip" x="274" y="139" width="64" height="24" rx="5"/>
  <text class="s" x="306" y="156" text-anchor="middle">checksum</text>
  <rect class="chip" x="346" y="139" width="124" height="24" rx="5"/>
  <text class="s" x="408" y="156" text-anchor="middle">TABLE_MAP registry</text>
  <rect class="chip" x="478" y="139" width="80" height="24" rx="5"/>
  <text class="s" x="518" y="156" text-anchor="middle">row decoder</text>

  <rect class="grp" x="62" y="178" width="560" height="59" rx="8"/>
  <text class="lbl" x="76" y="197">client</text>
  <text class="mono" x="150" y="197">core/src/client</text>
  <rect class="chip" x="76" y="206" width="86" height="24" rx="5"/>
  <text class="s" x="119" y="223" text-anchor="middle">BinlogClient</text>
  <rect class="chip" x="170" y="206" width="94" height="24" rx="5"/>
  <text class="s" x="217" y="223" text-anchor="middle">reader thread</text>
  <rect class="chip" x="272" y="206" width="80" height="24" rx="5"/>
  <text class="s" x="312" y="223" text-anchor="middle">EventQueue</text>
  <rect class="chip" x="360" y="206" width="124" height="24" rx="5"/>
  <text class="s" x="422" y="223" text-anchor="middle">ConnectionValidator</text>
  <rect class="chip" x="492" y="206" width="72" height="24" rx="5"/>
  <text class="s" x="528" y="223" text-anchor="middle">reconnect</text>

  <rect class="grp" x="62" y="245" width="560" height="59" rx="8"/>
  <text class="lbl" x="76" y="264">protocol</text>
  <text class="mono" x="150" y="264">core/src/protocol</text>
  <rect class="chip" x="76" y="273" width="80" height="24" rx="5"/>
  <text class="s" x="116" y="290" text-anchor="middle">TCP and TLS</text>
  <rect class="chip" x="164" y="273" width="86" height="24" rx="5"/>
  <text class="s" x="207" y="290" text-anchor="middle">auth plugins</text>
  <rect class="chip" x="258" y="273" width="72" height="24" rx="5"/>
  <text class="s" x="294" y="290" text-anchor="middle">COM_QUERY</text>
  <rect class="chip" x="338" y="273" width="80" height="24" rx="5"/>
  <text class="s" x="378" y="290" text-anchor="middle">binlog dump</text>
  <rect class="chip" x="426" y="273" width="118" height="24" rx="5"/>
  <text class="s" x="485" y="290" text-anchor="middle">read-ahead buffer</text>

  <path class="ln" d="M 624 73 H 666" marker-end="url(#a)"/>

  <rect class="card" x="672" y="44" width="264" height="260" rx="8"/>
  <text class="lbl" x="688" y="72">bindings</text>
  <text class="mono" x="688" y="92">bindings/</text>
  <text class="s" x="688" y="120">The same engine and client, named</text>
  <text class="s" x="688" y="135">the way each language names things.</text>
  <rect class="chip" x="688" y="152" width="74" height="28" rx="5"/>
  <text class="s" x="725" y="170" text-anchor="middle">C / C++</text>
  <rect class="chip" x="770" y="152" width="74" height="28" rx="5"/>
  <text class="s" x="807" y="170" text-anchor="middle">Node.js</text>
  <rect class="chip" x="852" y="152" width="74" height="28" rx="5"/>
  <text class="s" x="889" y="170" text-anchor="middle">Python</text>
  <text class="s" x="688" y="206">A C or C++ program links libmes,</text>
  <text class="s" x="688" y="221">Node loads an N-API addon, and</text>
  <text class="s" x="688" y="236">Python loads libmes through ctypes.</text>
  <text class="s" x="688" y="264">One shared behaviour contract holds</text>
  <text class="s" x="688" y="279">the three surfaces to the same rules.</text>

  <text class="s" x="480" y="330" text-anchor="middle">Nothing above the protocol layer knows it is reading a socket: the engine decodes whatever bytes it is fed.</text>
</svg>
