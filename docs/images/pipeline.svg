<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">From a binlog stream to row-level change events</title>
  <desc id="dsc">Four boxes left to right: the MySQL or MariaDB source, BinlogClient which owns the wire protocol and a bounded queue, CdcEngine which parses events and decodes row images, and the consuming application which receives ChangeEvent values. A band beneath the two middle boxes marks CdcStream, which drives both of them.</desc>

  <style>
    .bg    { fill:#f7f7f5 }
    .box   { fill:#ffffff; stroke:#d5d6d1 }
    .band  { fill:none; stroke:#2c6e8f; stroke-dasharray:6 5 }
    .ln    { fill:none; stroke:#2c6e8f; stroke-width:1.4 }
    .ah    { fill:#2c6e8f }
    .tick  { fill:none; stroke:#b6b7b1; stroke-width:1 }
    text   { font-family:Inter,"Helvetica Neue","Hiragino Sans","Noto Sans JP",Arial,sans-serif; fill:#1f2328 }
    .h     { font-size:13px }
    .lbl   { font-size:10px; fill:#6e7781; letter-spacing:.09em }
    .s     { font-size:10.5px; fill:#6e7781 }
    .flow  { font-size:10.5px; fill:#2c6e8f }
    .mono  { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:10px; fill:#8a6a1f }
    @media (prefers-color-scheme: dark) {
      .bg{fill:#0d1117}
      .box{fill:#161b22;stroke:#30363d}
      .band{stroke:#7fb3d5} .ln{stroke:#7fb3d5} .ah{fill:#7fb3d5} .flow{fill:#7fb3d5}
      .tick{stroke:#484f58} .mono{fill:#d9b45c}
      text{fill:#e6edf3} .lbl{fill:#8b949e} .s{fill:#8b949e}
    }
  </style>

  <defs>
    <marker id="a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="300" rx="12"/>

  <text class="flow" x="252" y="66" text-anchor="middle">binlog stream</text>
  <text class="flow" x="480" y="66" text-anchor="middle">event bytes</text>
  <text class="flow" x="708" y="66" text-anchor="middle">ChangeEvent</text>

  <rect class="box" x="42" y="76" width="192" height="124" rx="8"/>
  <text class="lbl" x="58" y="100">SOURCE</text>
  <text class="h" x="58" y="122">MySQL / MariaDB</text>
  <text class="s" x="58" y="148">row-format binary log</text>
  <text class="s" x="58" y="166">GTID enabled</text>
  <text class="mono" x="58" y="185">binlog_row_image=FULL</text>

  <rect class="box" x="270" y="76" width="192" height="124" rx="8"/>
  <text class="lbl" x="286" y="100">TRANSPORT</text>
  <text class="h" x="286" y="122">BinlogClient</text>
  <text class="s" x="286" y="148">handshake, auth, TLS</text>
  <text class="s" x="286" y="166">GTID dump request</text>
  <text class="s" x="286" y="184">reader thread, bounded queue</text>

  <rect class="box" x="498" y="76" width="192" height="124" rx="8"/>
  <text class="lbl" x="514" y="100">DECODE</text>
  <text class="h" x="514" y="122">CdcEngine</text>
  <text class="s" x="514" y="148">event header and checksum</text>
  <text class="s" x="514" y="166">TABLE_MAP registry</text>
  <text class="s" x="514" y="184">row images, column values</text>

  <rect class="box" x="726" y="76" width="192" height="124" rx="8"/>
  <text class="lbl" x="742" y="100">CONSUMER</text>
  <text class="h" x="742" y="122">Your application</text>
  <text class="s" x="742" y="148">INSERT, UPDATE, DELETE</text>
  <text class="s" x="742" y="166">before and after images</text>
  <text class="s" x="742" y="184">column names, GTID position</text>

  <path class="ln" d="M 236 138 H 266" marker-end="url(#a)"/>
  <path class="ln" d="M 464 138 H 494" marker-end="url(#a)"/>
  <path class="ln" d="M 692 138 H 722" marker-end="url(#a)"/>

  <path class="tick" d="M 270 208 V 216"/>
  <path class="tick" d="M 690 208 V 216"/>
  <rect class="band" x="270" y="216" width="420" height="44" rx="8"/>
  <text class="h" x="286" y="235">CdcStream</text>
  <text class="s" x="286" y="252">drives both, and reconnects from the last delivered checkpoint</text>

  <text class="s" x="726" y="240">The engine alone also runs on bytes</text>
  <text class="s" x="726" y="256">from any other source.</text>

  <text class="s" x="42" y="284">The MySQL wire protocol is implemented directly on OpenSSL, so no client library is linked in.</text>
</svg>
